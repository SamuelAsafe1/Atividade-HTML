<body>
    <h1>Suporte</h1>
<br><br>
    <a href="index.html"> << Voltar ao menu</a>

    <p>Nossos contatos de suporte:</p>
<br>
    <a href="https://wa.me">
    <img src="imagens/whatsapp.jpg" alt="whatsapp"
    width="50"></a>
    <a href="https://www.instagram.com">
    <img src="imagens/instagram.jpg" alt="instagram"
    width="47">
    </a>
<br><br><br>
    <p>Ou envie para nós abaixo sua dúvida:</p> 
<br><br>
    <form action="">
        <label for="nome">Nome:</label>
        <input type="text" name="name" 
        placeholder="Digite seu nome"required>
<br><br>
        <label for="email">E-mail:</label>
        <input type="email" name="email" 
        placeholder="Digite seu e-mail"required>
<br><br>
    
        <label for="telefone">Telefone:</label>
        <input type="text" name="Telefone"
        placeholder="Número de telefone">
<br><br>
        <label for="data">Data de Atendimento: </label>
        <input type="date" name="data" 
        placeholder="Data desejada">
<br><br>
        <label for="mensagem">Mensagem: </label>
        <input type="text" name="mensagem"
        placeholder="Digite sua mensagem:">
<br><br>
        <label for="Produto">Produto:</label>
        <select name="Produto" id="Produto">
            <option value="nenhum">nenhum</option>
            <option value="teclado">Teclado gamer</option>
            <option value="volante">Volante gamer</option>
            <option value="monitor">Monitor</option>
        </select>
<br><br>
        <label for="termos">Aceite os termos: </label>
        <input type="checkbox" title="Ao marcar essa caixa, concordo com os termos de privacidade" 
        >
<br><br>
        <label for="enviar"></label>
        <input type="button" value="enviar">
        <label for="limpar"></label>
        <input type="reset" value="limpar">
            
        
    </form>
   
</body>
